name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Check build output
      if: always()
      run: |
        echo "=== Checking app/build structure ==="
        find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
        ls -la app/build/outputs/ 2>/dev/null || echo "No outputs directory"
        tail -50 build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
